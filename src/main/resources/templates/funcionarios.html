<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inPulse - Gestão de Funcionários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body style="background-color: #f8f9fa;">

     <!-- Navbar Padrão do Sistema -->
    <nav class="navbar navbar-dark navbar-expand-lg" style="background-color: #1a3a52;">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-3" href="#">
                    <span style="color: #ffd700;">in</span><span class="text-white">Pulse</span>
                </a>
                <span class="navbar-text text-white-50 d-none d-lg-block border-start border-secondary ps-3 ms-3">
                    Gestão de funcionários
                </span>
            </div>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="d-lg-none d-flex align-items-center justify-content-between text-white mt-3 mb-2 ps-2">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-user-circle fa-2x me-2"></i>
                        <span class="fw-bold" id="user-name-mobile"></span>
                    </div>
                    <a href="#" class="btn btn-outline-light btn-sm me-2">
                        <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
                <hr class="d-lg-none text-white-50">

                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/ideias">Ideias</a>
                    </li>
                </ul>

                <div class="text-white d-none d-lg-flex align-items-center">
                    <i class="fas fa-user-circle fa-2x me-2"></i>
                    <div class="d-flex flex-column lh-1">
                        <span class="small">Bem-vindo</span>
                        <span class="fw-bold" id="user-name-desktop"></span>
                    </div>
                    <a href="/" class="btn btn-outline-light btn-sm ms-3">
                        <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        <h2 class="mb-4" style="color: #1a3a52; font-weight: 600;">Painel de Gestão de Funcionários</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6 col-lg-3">
                        <label for="searchId" class="form-label small fw-bold">Buscar por ID</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchId" placeholder="ID do funcionário">
                            <button class="btn btn-primary" type="button" id="searchButton"><i
                                    class="fas fa-search"></i></button>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label for="filterTier" class="form-label small fw-bold">Filtrar por Nível</label>
                        <select id="filterTier" class="form-select">
                            <option value="todos" selected>Todos</option>
                            <option value="Bronze">Bronze</option>
                            <option value="Prata">Prata</option>
                            <option value="Ouro">Ouro</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label for="sortOrder" class="form-label small fw-bold">Ordenar por</label>
                        <select id="sortOrder" class="form-select">
                            <option value="id_asc" selected>ID (Menor para o Maior)</option>
                            <option value="id_desc">ID (Maior para o Menor)</option>
                            <option value="nome_asc">Nome (A-Z)</option>
                            <option value="nome_desc">Nome (Z-A)</option>
                            <option value="pontos_desc">Pontuação (Maior)</option>
                            <option value="pontos_asc">Pontuação (Menor)</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-3 d-flex justify-content-end">
                        <button class="btn btn-outline-secondary" type="button" id="clearFiltersButton">
                            <i class="fas fa-filter"></i> Limpar Filtros
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="text-muted small">ID</th>
                        <th class="text-muted small">Nome</th>
                        <th class="text-muted small">E-mail</th>
                        <th class="text-muted small">Pontuação</th>
                        <th class="text-muted small">Nível</th>
                        <th class="text-muted small text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="funcionarios-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #1a3a52; color: #fff;">
                    <h5 class="modal-title" id="detailsModalLabel">Detalhes do Funcionário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="details-modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/user_info.js"></script>
    <script src="/js/funcionarios.js"></script>
</body>

</html>
