<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inPulse - Gestão de Programas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body style="background-color: #f8f9fa;">

    <!-- Navbar Padrão do Sistema -->
    <nav class="navbar navbar-dark navbar-expand-lg" style="background-color: #1a3a52;">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-3" href="#">
                    <span style="color: #ffd700;">in</span><span class="text-white">Pulse</span>
                </a>
                <span class="navbar-text text-white-50 d-none d-lg-block border-start border-secondary ps-3 ms-3">
                    Gestão de programas
                </span>
            </div>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="d-lg-none d-flex align-items-center justify-content-between text-white mt-3 mb-2 ps-2">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-user-circle fa-2x me-2"></i>
                        <span class="fw-bold" id="user-name-mobile"></span>
                    </div>
                    <a href="#" class="btn btn-outline-light btn-sm me-2">
                        <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
                <hr class="d-lg-none text-white-50">

                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/ideias">Ideias</a>
                    </li>
                </ul>
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/usuarios">Usuários</a>
                    </li>
                </ul>
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/itens">Itens</a>
                    </li>
                </ul>

                <div class="text-white d-none d-lg-flex align-items-center">
                    <i class="fas fa-user-circle fa-2x me-2"></i>
                    <div class="d-flex flex-column lh-1">
                        <span class="small">Bem-vindo</span>
                        <span class="fw-bold" id="user-name-desktop"></span>
                    </div>
                    <a href="/" class="btn btn-outline-light btn-sm ms-3">
                        <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        <h2 class="mb-4" style="color: #1a3a52; font-weight: 600;">Painel de Gestão de Programas</h2>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="text-muted small">ID</th>
                        <th class="text-muted small">Nome do Programa</th>
                        <th class="text-muted small">Período</th>
                        <th class="text-muted small">Total de Participantes</th>
                        <th class="text-muted small">Ideias Associadas</th>
                        <th class="text-muted small text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="programas-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #1a3a52; color: #fff;">
                    <h5 class="modal-title" id="detailsModalLabel">Detalhes do Programa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="details-modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/user_info.js"></script>
    <script src="/js/programas.js"></script>
</body>

</html>
