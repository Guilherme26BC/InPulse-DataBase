<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inPulse - Logs de Auditoria</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS customizado -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body style="background-color: #f8f9fa;">

    <!-- Navbar Padrão do Sistema -->
    <nav class="navbar navbar-dark navbar-expand-lg" style="background-color: #1a3a52;">
        <div class="container-fluid">
            <!-- Logo e Título da Página -->
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-3" href="#">
                    <span style="color: #ffd700;">in</span><span class="text-white">Pulse</span>
                </a>
                <span class="navbar-text text-white-50 d-none d-lg-block border-start border-secondary ps-3 ms-3">
                    Logs de Auditoria
                </span>
            </div>

            <!-- Botão Toggler para Mobile -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Conteúdo da Navbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Informações do Usuário (Mobile) -->
                <div class="d-lg-none d-flex align-items-center justify-content-between text-white mt-3 mb-2 ps-2">
                     <div class="d-flex align-items-center">
                        <i class="fas fa-user-circle fa-2x me-2"></i>
                        <span class="fw-bold">Lucas Bezerra</span>
                    </div>
                    <a href="#" class="btn btn-outline-light btn-sm me-2">
                        <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
                <hr class="d-lg-none text-white-50">

                <!-- Links de Navegação Centralizados -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="./ideias.html">Dashboard de Ideias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="./aprovacao.html">Aprovação de Ideia</a>
                    </li>
                </ul>

                <!-- Informações do Usuário (Desktop) -->
                <div class="text-white d-none d-lg-flex align-items-center">
                    <i class="fas fa-user-circle fa-2x me-2"></i>
                    <div class="d-flex flex-column lh-1">
                        <span class="small">Bem-vindo</span>
                        <span class="fw-bold">Lucas Bezerra</span>
                    </div>
                    <a href="/" class="btn btn-outline-light btn-sm ms-3">
                       <i class="fas fa-sign-out-alt me-1"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container-fluid p-4">
        <h2 class="mb-4" style="color: #1a3a52; font-weight: 600;">Logs de Auditoria de Ações</h2>

        <!-- Card de Filtros -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="filterLogType" class="form-label small fw-bold">Tipo de Log</label>
                        <select id="filterLogType" class="form-select">
                            <option value="todos" selected>Todos</option>
                            <option value="aprovado">Aprovado</option>
                            <option value="aguardando_aprovacao">Aguardando Aprovação</option>
                            <option value="enviada_com_sucesso">Enviada com Sucesso</option>
                            <option value="cancelado">Cancelado</option>
                            <option value="erro">Erro</option>
                            <option value="enviada">Enviada</option>
                            <option value="auditado">Auditado</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Período</label>
                        <div class="input-group">
                            <input type="date" id="startDate" class="form-control" aria-label="Data de início">
                            <span class="input-group-text">até</span>
                            <input type="date" id="endDate" class="form-control" aria-label="Data de fim">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Logs -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="text-muted small">Data e Hora</th>
                        <th class="text-muted small">Tipo de Log</th>
                        <th class="text-muted small">Usuário</th>
                        <th class="text-muted small">Detalhes da Ação</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <!-- Conteúdo gerado via js/logs.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Customizado -->
    <script src="/js/logs.js"></script>
    <script src="/js/user_info.js"></script>
</body>

</html>
